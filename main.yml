name: 24/7 Live Hot-Reload & Watchdog Bot (@voiceandpasokhbot)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  schedule:
    # پشتیبان زمان‌بندی، در حالی که استارت اصلی بدون وقفه توسط گام Self Re-Trigger انجام می‌شود
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: write

# جلوگیری از اجرای موازی دو نمونه از بات و خطای تداخل getUpdates در تلگرام
concurrency:
  group: voiceandpasokhbot-live-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 📥 دریافت مخزن کد (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 نصب پایتون (Set up Python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 نصب ابزارها و پیش‌نیازها (Install Dependencies)
        run: |
          sudo apt-get update -y && sudo apt-get install -y psmisc lsof sqlite3 ffmpeg openssl
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🔐 بازیابی ایمن دیتابیس از کش گیت‌هاب (بدون انتشار عمومی در مخزن)
        uses: actions/cache/restore@v4
        with:
          path: voice_bot.db.enc
          key: voice-bot-db-${{ github.ref_name }}-
          restore-keys: |
            voice-bot-db-${{ github.ref_name }}-
            voice-bot-db-

      - name: 🔓 رمزگشایی دیتابیس در محیط ایزوله رانر
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -f "voice_bot.db.enc" ] && [ -n "$BOT_TOKEN" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in voice_bot.db.enc -out voice_bot.db -pass env:BOT_TOKEN || rm -f voice_bot.db
          fi

      - name: 🔥 اجرای ۲۴/۷ با مکانیزم ترکیبی Hot-Reload و Watchdog (ضد کرش و بدون افشای توکن)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          PRIVATE_CHAT_ONLY: "true"
          TRANSCRIBE_MODEL: "gemini-2.5-flash"
          CHAT_MODEL: "gemini-2.5-flash"
          DB_PATH: "voice_bot.db"
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::لطفاً متغیرهای BOT_TOKEN و GEMINI_API_KEY را در بخش Settings -> Secrets and variables -> Actions مخزن گیت‌هاب وارد کنید."
            exit 1
          fi
          chmod +x run_workflow.sh
          ./run_workflow.sh

      - name: 🔒 رمزنگاری دیتابیس با کلید اختصاصی قبل از ذخیره در کش
        if: ${{ always() }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -f "voice_bot.db" ] && [ -n "$BOT_TOKEN" ]; then
            sqlite3 voice_bot.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
            rm -f voice_bot.db-wal voice_bot.db-shm
            openssl enc -aes-256-cbc -salt -pbkdf2 -in voice_bot.db -out voice_bot.db.enc -pass env:BOT_TOKEN || true
            rm -f voice_bot.db
          fi

      - name: 💾 ذخیره دیتابیس رمزنگاری‌شده در کش خصوصی اکشنز (بدون Commit در مخزن پابلیک)
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: voice_bot.db.enc
          key: voice-bot-db-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 🔄 استارت خودکار سیکل بعدی بدون قطعی (Self Re-Trigger)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 در حال استارت آنی سیکل بعدی..."
          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          gh workflow run "main.yml" --ref "$BRANCH_NAME" || true
          echo "✅ سیکل جدید با موفقیت استارت خورد!"
